name: Test, build and release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version from package.json to GitHub Releases
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: webinar-release-${{ github.event_name == 'pull_request' && github.ref || 'stable' }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check desktop/main.cjs && node --check desktop/renderer.js
      - name: Install recording test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libnss3 libgbm1 libasound2t64
          node node_modules/electron/install.js
      - name: Record hidden webinar and seek saved video forward and backward
        run: xvfb-run -a npm run test:desktop
  windows:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Windows installer and update metadata
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: WebinarRecorder-Windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
      - name: Publish complete GitHub Release
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
        run: node scripts/publish-release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
