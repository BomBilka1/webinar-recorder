name: Build desktop application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [win32, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python scripts/package.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: WebinarRecorder-${{ matrix.platform }}-x64
          path: dist/*.zip
